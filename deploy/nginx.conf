# Quadrix Radio Nginx config — terminates TLS, proxies to Django + Icecast.
# Replace radio.example.com and the cert paths.

upstream django {
    server django:8000;
    keepalive 32;
}

upstream icecast {
    server icecast:8000;
    keepalive 32;
}

# Cache hot mobile API responses for a few seconds at the edge.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_cache:10m
                 max_size=200m inactive=5m use_temp_path=off;

server {
    listen 80;
    server_name radio.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name radio.example.com;

    ssl_certificate     /etc/letsencrypt/live/radio.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radio.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 600m;  # admin uploads
    proxy_read_timeout 60s;
    proxy_buffering on;

    # ---------- Audio stream (Icecast) ----------
    # Mobile players hit /stream.mp3 — proxy to Icecast /stream mount.
    # Buffering OFF so audio is delivered live, not chunked by Nginx.
    location ~ ^/stream(\.mp3)?$ {
        proxy_pass http://icecast/stream;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-cache" always;
    }

    location /status-json.xsl {
        proxy_pass http://icecast/status-json.xsl;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ---------- Mobile public API ----------
    location ~ ^/api/radio/(current|status)/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache api_cache;
        proxy_cache_valid 200 5s;     # short edge cache, Django also caches
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Django admin / static ----------
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/  { alias /var/www/quadrix/static/; expires 7d; }
    location /media/   { alias /var/www/quadrix/media/;  expires 1d; }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
