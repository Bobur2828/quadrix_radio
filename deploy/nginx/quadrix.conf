# Quadrix Radio — Nginx production config.
#
# Server: 83.222.16.31 (no domain yet → IP-based access)
#
# Routes:
#   /api/radio/stream.mp3   → audio stream (no buffering, no proxy_cache)
#   /ws/                    → WebSocket upgrade (DJ live mic)
#   /static/, /media/       → served directly by Nginx
#   everything else         → proxied to gunicorn ASGI on 127.0.0.1:8001
#
# Once you point a domain at this server, uncomment the SSL block at the
# bottom and run certbot.

upstream quadrix_app {
    server 127.0.0.1:8001 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # IP only; the other sites (drive, yurtim) match by their domain.
    server_name 83.222.16.31;

    # Big body for audio uploads from DJ dashboard
    client_max_body_size 600m;

    # Real client IP (so Django listener-session geo lookups work)
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;

    access_log /var/log/nginx/quadrix-access.log;
    error_log  /var/log/nginx/quadrix-error.log warn;

    # ───────── Static + media (served directly) ─────────
    location /static/ {
        alias /var/www/quadrix_radio/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
    location /media/ {
        alias /var/www/quadrix_radio/media/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # ───────── Audio stream ─────────
    # Buffering MUST be off — this is a live infinite stream, not a file.
    location ~ ^/api/radio/(stream\.mp3|stream)/?$ {
        proxy_pass http://quadrix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Keep connection alive for hours of listening
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        keepalive_timeout 75s;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # ───────── WebSocket (DJ live mic upload) ─────────
    location /ws/ {
        proxy_pass http://quadrix_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # ───────── Cache hot read-only API responses ─────────
    location ~ ^/api/radio/(current|status)/ {
        proxy_pass http://quadrix_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ───────── Everything else (admin, API, DJ dashboard) ─────────
    location / {
        proxy_pass http://quadrix_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}

# ═════════════════════════════════════════════════════════════════
# After you point a domain at this server (e.g. radio.example.com),
# install certbot (`apt install certbot python3-certbot-nginx`),
# replace `83.222.16.31` above with `radio.example.com`, then run:
#     certbot --nginx -d radio.example.com
# Certbot will inject the SSL block automatically.
# ═════════════════════════════════════════════════════════════════
